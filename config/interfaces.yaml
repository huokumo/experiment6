r1_motion_adapter:
  ros__parameters:
    max_linear: 0.25
    max_angular: 0.6
    command_timeout: 0.4
    pose_timeout: 0.5
    depth_timeout: 1.5
    require_depth: false

r1_depth_obstacles:
  ros__parameters:
    pixel_stride: 2
    depth_timeout: 1.5
    min_depth: 0.1
    max_depth: 10.0
    max_range: 4.0
    min_height: 0.06
    max_height: 1.5
    self_radius: 0.30
    front_half_angle_deg: 10.0
    max_bearing_deg: 60.0
    min_valid_ratio: 0.35
    min_sector_pixels: 20
    blocked_distance: 0.85
    publish_debug: true
