name: Build and interface contracts
on: [push, pull_request]
jobs:
  numerical-contracts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install numpy
      - run: python tools/check_source.py
      - run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Iinclude tests/test_planar_geometry.cpp -o /tmp/test_planar_geometry
      - run: /tmp/test_planar_geometry

  humble-fortress:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    env:
      ROS_DOMAIN_ID: '173'
      IGN_PARTITION: experiment6-ci
    steps:
      - uses: actions/checkout@v4
      - name: Install Fortress and course dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl gnupg git build-essential
          curl -fsSL https://packages.osrfoundation.org/gazebo.gpg -o /usr/share/keyrings/gazebo.gpg
          echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/gazebo.gpg] https://packages.osrfoundation.org/gazebo/ubuntu-stable jammy main' > /etc/apt/sources.list.d/gazebo-stable.list
          apt-get update
          apt-get install -y --no-install-recommends libignition-gazebo6-dev libignition-gazebo6-plugins \
            ros-humble-ros-gz ros-humble-robot-state-publisher ros-humble-tf2-ros ros-humble-tf2-ros-py \
            ros-humble-ament-cmake-python ros-humble-rosidl-default-generators \
            python3-numpy python3-opencv python3-yaml python3-colcon-common-extensions
      - name: Build with experiment-5 assets
        shell: bash
        run: |
          mkdir -p /tmp/exp6_ws/src
          ln -s "$GITHUB_WORKSPACE" /tmp/exp6_ws/src/experiment6_navigation
          git clone --depth 1 https://github.com/huokumo/experiment5.git /tmp/exp6_ws/src/experiment5_depth
          cd /tmp/exp6_ws
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install --event-handlers console_direct+
      - name: Check native Fortress and ROS message contracts
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source /tmp/exp6_ws/install/setup.bash
          cd /tmp/exp6_ws
          colcon test --packages-select experiment6_navigation --event-handlers console_direct+
          colcon test-result --verbose
          cd "$GITHUB_WORKSPACE"
          /usr/bin/python3 -s -m unittest discover -s tests -p test_ros_integration.py -v
      - name: Compile optional R1 SDK backend without connecting hardware
        shell: bash
        run: |
          git clone https://github.com/unitreerobotics/unitree_sdk2.git /tmp/unitree_sdk2
          git -C /tmp/unitree_sdk2 checkout 63096d0ac0c5d2dec9d6e0c22cd5233410ca2f36
          cmake -S /tmp/unitree_sdk2 -B /tmp/sdk2-build -DBUILD_EXAMPLES=OFF -DCMAKE_INSTALL_PREFIX=/tmp/sdk2-install
          cmake --install /tmp/sdk2-build
          source /opt/ros/humble/setup.bash
          source /tmp/exp6_ws/install/setup.bash
          cd /tmp/exp6_ws
          colcon build --symlink-install --packages-select experiment6_navigation \
            --cmake-args -DBUILD_UNITREE_ADAPTER=ON -Dunitree_sdk2_DIR=/tmp/sdk2-install/lib/cmake/unitree_sdk2
